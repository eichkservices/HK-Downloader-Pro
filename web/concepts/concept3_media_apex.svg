<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#121d2d"/>
      <stop offset="55%" stop-color="#080e18"/>
      <stop offset="100%" stop-color="#03060a"/>
    </radialGradient>
    <linearGradient id="ringOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="rocketArrow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="40%" stop-color="#22d3ee"/>
      <stop offset="75%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="dropShadow3" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGlow3)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="rgba(34,211,238,0.2)" stroke-width="1.5"/>

  <!-- High-Tech Orbit Rings (Symbolizing Global CDN & Streaming Networks) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="14"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringOrbit)" stroke-width="14" stroke-dasharray="260 70 140 50" stroke-linecap="round"/>

  <!-- Media Play Crest + Downward Rocket Arrow -->
  <g filter="url(#dropShadow3)">
    <!-- Aerodynamic Downward Arrowhead -->
    <path d="M256 120 L356 248 L296 248 L296 340 L256 386 L216 340 L216 248 L156 248 Z" fill="url(#rocketArrow)"/>
    <!-- Left Glass Reflection -->
    <path d="M256 120 L256 386 L216 340 L216 248 L156 248 Z" fill="rgba(255,255,255,0.18)"/>
    <!-- Top Apex Highlight -->
    <path d="M156 248 L256 120 L356 248" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Launch Platform Bottom Pad -->
    <rect x="206" y="408" width="100" height="16" rx="8" fill="#ff8a3d"/>
    <rect x="236" y="408" width="40" height="16" rx="8" fill="#fef08a"/>
  </g>
</svg>