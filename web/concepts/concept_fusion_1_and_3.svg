<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="fBgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="55%" stop-color="#0a0d16"/>
      <stop offset="100%" stop-color="#030408"/>
    </radialGradient>
    <linearGradient id="fRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="fCyanL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="35%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="fCyanR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="fOraL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="fOraR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#fBgGlow)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="rgba(34,211,238,0.2)" stroke-width="1.5"/>

  <!-- High-Speed Streaming Orbit Ring (Concept 3 element) -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="14"/>
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#fRingGrad)" stroke-width="14" stroke-dasharray="270 70 140 50" stroke-linecap="round"/>

  <!-- Core 3D Prismatic Chevrons (Concept 1 element) -->
  <g filter="url(#fShadow)">
    <!-- Top 3D Cyan Chevron -->
    <path d="M142 172 L198 172 L256 258 L256 302 L142 172 Z" fill="url(#fCyanL)"/>
    <path d="M370 172 L314 172 L256 258 L256 302 L370 172 Z" fill="url(#fCyanR)"/>
    <line x1="256" y1="258" x2="256" y2="302" stroke="rgba(255,255,255,0.9)" stroke-width="2.5"/>
    <path d="M142 172 L198 172 L256 258 L314 172 L370 172" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom 3D Orange Chevron -->
    <path d="M142 278 L198 278 L256 364 L256 408 L142 278 Z" fill="url(#fOraL)"/>
    <path d="M370 278 L314 278 L256 364 L256 408 L370 278 Z" fill="url(#fOraR)"/>
    <line x1="256" y1="364" x2="256" y2="408" stroke="rgba(255,255,255,0.9)" stroke-width="2.5"/>
    <path d="M142 278 L198 278 L256 364 L314 278 L370 278" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>